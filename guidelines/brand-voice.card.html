<!-- @dsCard group="Brand" viewport="700x230" name="Voice in use" subtitle="How Claudicted writes — warm, plainspoken, anyone-can-build-this" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); }
  .eyebrow { font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--brand-press); margin:0 0 8px;}
  .head { font-family:var(--font-display); font-weight:900; letter-spacing:-0.025em; font-size:30px; color:var(--ink-900); margin:0 0 6px; line-height:1.05;}
  .sub { font-family:var(--font-body); font-size:16px; color:var(--text-muted); margin:0 0 16px; max-width:54ch;}
  .do { display:flex; gap:24px; }
  .col { flex:1; }
  .tag { font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 6px;}
  .yes .tag { color: var(--pine-600);} .no .tag { color: var(--berry-500);}
  .col p { font-family:var(--font-body); font-size:13.5px; margin:0 0 4px; color:var(--text-body);}
  .no p { color: var(--text-faint); text-decoration: line-through; text-decoration-color: var(--berry-500);}
</style>
</head>
<body>
  <p class="eyebrow">Build log #14</p>
  <h3 class="head">You don't need permission to build.</h3>
  <p class="sub">You need a weekend and a spark. We'll show you the rest. No experience required — seriously.</p>
  <div class="do">
    <div class="col yes"><p class="tag">Say this</p><p>"It broke twice, then it worked."</p><p>"Steal this setup."</p></div>
    <div class="col no"><p class="tag">Not this</p><p>"Leverage AI synergies at scale."</p><p>"Become a 10x ninja."</p></div>
  </div>
</body>
</html>
