<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radii" subtitle="Friendly rounding, xs → pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-card); }
  .row { display:flex; gap:16px; align-items:flex-end; }
  .b { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .sw { width:74px; height:74px; background:var(--clay-100); border:2px solid var(--clay-400); }
  .k { font-family: var(--font-mono); font-size:10.5px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="b"><div class="sw" style="border-radius:var(--radius-xs)"></div><span class="k">xs · 4</span></div>
    <div class="b"><div class="sw" style="border-radius:var(--radius-sm)"></div><span class="k">sm · 8</span></div>
    <div class="b"><div class="sw" style="border-radius:var(--radius-md)"></div><span class="k">md · 12</span></div>
    <div class="b"><div class="sw" style="border-radius:var(--radius-lg)"></div><span class="k">lg · 18</span></div>
    <div class="b"><div class="sw" style="border-radius:var(--radius-xl)"></div><span class="k">xl · 26</span></div>
    <div class="b"><div class="sw" style="border-radius:var(--radius-2xl)"></div><span class="k">2xl · 36</span></div>
    <div class="b"><div class="sw" style="border-radius:var(--radius-pill)"></div><span class="k">pill</span></div>
  </div>
</body>
</html>
