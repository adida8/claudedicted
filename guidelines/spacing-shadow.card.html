<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows" subtitle="Soft warm depth + the signature hard ink offset" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 24px; background: var(--surface-card); }
  .row { display:flex; gap:26px; align-items:center; }
  .b { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .sw { width:90px; height:64px; background:var(--cream-50); border-radius:var(--radius-md); }
  .ink { border:2.5px solid var(--ink-900); }
  .k { font-family: var(--font-mono); font-size:10.5px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="b"><div class="sw" style="box-shadow:var(--shadow-sm)"></div><span class="k">shadow-sm</span></div>
    <div class="b"><div class="sw" style="box-shadow:var(--shadow-md)"></div><span class="k">shadow-md</span></div>
    <div class="b"><div class="sw" style="box-shadow:var(--shadow-lg)"></div><span class="k">shadow-lg</span></div>
    <div class="b"><div class="sw ink" style="box-shadow:var(--shadow-ink)"></div><span class="k">shadow-ink</span></div>
    <div class="b"><div class="sw ink" style="box-shadow:var(--shadow-ink-lg)"></div><span class="k">shadow-ink-lg</span></div>
  </div>
</body>
</html>
