<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="2xs → 6xl, the full ramp at a glance" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 24px; background: var(--surface-card); }
  .r { display:flex; align-items:baseline; gap:14px; border-bottom:1px solid var(--cream-200); padding:5px 0; }
  .r:last-child{border:0;}
  .t { font-family: var(--font-display); font-weight:800; color: var(--text-strong); white-space:nowrap; line-height:1.1; }
  .k { font-family: var(--font-mono); font-size:10.5px; color: var(--text-muted); margin-left:auto; }
</style>
</head>
<body>
  <div class="r"><span class="t" style="font-size:44px">Build</span><span class="k">3xl · 44</span></div>
  <div class="r"><span class="t" style="font-size:34px">Build something</span><span class="k">2xl · 34</span></div>
  <div class="r"><span class="t" style="font-size:26px">Build something today</span><span class="k">xl · 26</span></div>
  <div class="r"><span class="t" style="font-size:21px">Build something today with AI</span><span class="k">lg · 21</span></div>
  <div class="r"><span class="t" style="font-size:18px;font-weight:600">Build something today with a spark</span><span class="k">md · 18</span></div>
  <div class="r"><span class="t" style="font-size:14px;font-weight:500">Build something today with a spark of energy</span><span class="k">sm · 14</span></div>
</body>
</html>
