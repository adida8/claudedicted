<!-- @dsCard group="Type" viewport="700x200" name="Display — Bitter" subtitle="Bold slab serif, tight tracking — headlines & the wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); }
  .d { font-family: var(--font-display); color: var(--text-strong); letter-spacing: var(--tracking-tight); line-height: 1.02; margin: 0; }
  .big { font-size: 56px; font-weight: 900; }
  .mid { font-size: 32px; font-weight: 800; margin-top: 10px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing:.08em; margin-top: 14px; }
</style>
</head>
<body>
  <p class="d big">Anyone can build this.</p>
  <p class="d mid">Bitter · 900 / 800</p>
  <p class="meta">DISPLAY · --font-display · tracking -0.02em</p>
</body>
</html>
