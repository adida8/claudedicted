<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base grid, --space-1 → --space-12" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 24px; background: var(--surface-card); }
  .r { display:flex; align-items:center; gap:12px; margin-bottom:7px; }
  .bar { height:16px; background:var(--clay-300); border-radius:3px; }
  .k { font-family: var(--font-mono); font-size:11px; color: var(--text-muted); width:140px; }
</style>
</head>
<body>
  <div class="r"><span class="k">--space-1 · 4</span><span class="bar" style="width:4px"></span></div>
  <div class="r"><span class="k">--space-2 · 8</span><span class="bar" style="width:8px"></span></div>
  <div class="r"><span class="k">--space-3 · 12</span><span class="bar" style="width:12px"></span></div>
  <div class="r"><span class="k">--space-4 · 16</span><span class="bar" style="width:16px"></span></div>
  <div class="r"><span class="k">--space-5 · 24</span><span class="bar" style="width:24px"></span></div>
  <div class="r"><span class="k">--space-6 · 32</span><span class="bar" style="width:32px"></span></div>
  <div class="r"><span class="k">--space-8 · 48</span><span class="bar" style="width:48px"></span></div>
  <div class="r"><span class="k">--space-10 · 80</span><span class="bar" style="width:80px"></span></div>
</body>
</html>
