<!-- @dsCard group="Colors" viewport="700x150" name="Clay-orange (primary)" subtitle="Brand ramp — base #D9694A drives CTAs, the spark, accents" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--surface-card); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; }
  .sw .n { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10px; opacity: 0.8; }
  .lo { color: var(--ink-900); }
  .hi { color: var(--cream-50); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw lo" style="background:var(--clay-50)"><span class="n">50</span><span class="h">#FBEEE9</span></div>
    <div class="sw lo" style="background:var(--clay-100)"><span class="n">100</span><span class="h">#F7DBCF</span></div>
    <div class="sw lo" style="background:var(--clay-200)"><span class="n">200</span><span class="h">#EFBCA6</span></div>
    <div class="sw lo" style="background:var(--clay-300)"><span class="n">300</span><span class="h">#E89C7E</span></div>
    <div class="sw hi" style="background:var(--clay-400)"><span class="n">400</span><span class="h">#E18464</span></div>
    <div class="sw hi" style="background:var(--clay-500)"><span class="n">500</span><span class="h">#D9694A</span></div>
    <div class="sw hi" style="background:var(--clay-600)"><span class="n">600</span><span class="h">#C2543A</span></div>
    <div class="sw hi" style="background:var(--clay-700)"><span class="n">700</span><span class="h">#A2402B</span></div>
    <div class="sw hi" style="background:var(--clay-800)"><span class="n">800</span><span class="h">#7C3220</span></div>
    <div class="sw hi" style="background:var(--clay-900)"><span class="n">900</span><span class="h">#592417</span></div>
  </div>
</body>
</html>
