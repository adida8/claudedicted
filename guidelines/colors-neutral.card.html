<!-- @dsCard group="Colors" viewport="700x150" name="Cream & ink neutrals" subtitle="Warm paper surfaces and the near-black ink ramp — no cool grays" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--surface-card); display:flex; flex-direction:column; gap:12px; }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 72px; display: flex; flex-direction: column; justify-content: flex-end; padding: 7px 9px; }
  .sw .n { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 9.5px; opacity: 0.75; }
  .lo { color: var(--ink-900); }
  .hi { color: var(--cream-50); }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); margin-bottom:-4px;}
</style>
</head>
<body>
  <span class="lbl">Cream / paper</span>
  <div class="row">
    <div class="sw lo" style="background:var(--cream-50);border:1px solid var(--cream-300)"><span class="n">50</span><span class="h">#FFFDF9</span></div>
    <div class="sw lo" style="background:var(--cream-100)"><span class="n">100</span><span class="h">#FBF6EE</span></div>
    <div class="sw lo" style="background:var(--cream-200)"><span class="n">200</span><span class="h">#F4ECDF</span></div>
    <div class="sw lo" style="background:var(--cream-300)"><span class="n">300</span><span class="h">#EADFCC</span></div>
    <div class="sw lo" style="background:var(--cream-400)"><span class="n">400</span><span class="h">#E0D2B9</span></div>
  </div>
  <span class="lbl">Ink</span>
  <div class="row">
    <div class="sw lo" style="background:var(--ink-300)"><span class="n">300</span><span class="h">#BCAE9B</span></div>
    <div class="sw hi" style="background:var(--ink-400)"><span class="n">400</span><span class="h">#9D8E7B</span></div>
    <div class="sw hi" style="background:var(--ink-500)"><span class="n">500</span><span class="h">#80715F</span></div>
    <div class="sw hi" style="background:var(--ink-700)"><span class="n">700</span><span class="h">#4A3F38</span></div>
    <div class="sw hi" style="background:var(--ink-900)"><span class="n">900</span><span class="h">#221C19</span></div>
  </div>
</body>
</html>
