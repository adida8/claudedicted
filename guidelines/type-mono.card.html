<!-- @dsCard group="Type" viewport="700x150" name="Mono eyebrows — JetBrains Mono" subtitle="Uppercase, wide-tracked meta labels & code" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); display:flex; flex-direction:column; gap:14px; }
  .chips { display:flex; gap:10px; flex-wrap:wrap; }
  .chip { font-family: var(--font-mono); font-weight:500; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color: var(--brand-press); border:1.5px solid var(--clay-200); background:var(--clay-50); padding:6px 11px; border-radius: var(--radius-pill); }
  .code { font-family: var(--font-mono); font-size:13px; color: var(--text-body); background:var(--cream-200); padding:10px 14px; border-radius:var(--radius-sm); width:fit-content;}
  .code .g { color: var(--pine-600); }
</style>
</head>
<body>
  <div class="chips">
    <span class="chip">Build log #14</span>
    <span class="chip">New drop</span>
    <span class="chip">5 min read</span>
    <span class="chip">Ep. 12</span>
  </div>
  <code class="code">npx <span class="g">claudicted</span> create my-first-build</code>
</body>
</html>
