<!-- @dsCard group="Type" viewport="700x210" name="Body — Hanken Grotesk" subtitle="Warm humanist grotesque for running text & UI, 400–700" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); font-family: var(--font-body); color: var(--text-body); }
  .lead { font-size: 18px; line-height: 1.6; max-width: 58ch; margin: 0 0 12px; }
  .lead strong { font-weight: 700; color: var(--text-strong); }
  .weights { display:flex; gap: 22px; align-items:baseline; }
  .weights span { font-size: 19px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing:.08em; margin-top: 14px; }
</style>
</head>
<body>
  <p class="lead">We built this in a weekend — and <strong>you can too.</strong> Short, plainspoken sentences that read easily at eighteen pixels.</p>
  <div class="weights">
    <span style="font-weight:400">Regular 400</span>
    <span style="font-weight:500">Medium 500</span>
    <span style="font-weight:600">Semibold 600</span>
    <span style="font-weight:700">Bold 700</span>
  </div>
  <p class="meta">BODY · --font-body · 18px / 1.65</p>
</body>
</html>
