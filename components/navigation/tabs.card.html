<!-- @dsCard group="Components" viewport="700x220" name="Tabs" subtitle="Underline and pill tab strips, with counts" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 28px 26px; background: var(--surface-card); }
  .stack { display: grid; gap: 28px; }
  .lbl { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Tabs } = window.ClaudictedDesignSystem_62a20b;
    function Demo() {
      return (
        <div className="stack">
          <div><p className="lbl">Underline</p>
            <Tabs tabs={["Latest","Popular","Build logs"]} defaultValue="Latest" />
          </div>
          <div><p className="lbl">Pill, with counts</p>
            <Tabs variant="pill" defaultValue="all" tabs={[
              {id:"all",label:"All",count:42},
              {id:"ai",label:"AI apps",count:12},
              {id:"auto",label:"Automations",count:9},
              {id:"nocode",label:"No-code",count:21},
            ]} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>
